<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wiki Chatbot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f4f6f8; display: flex; flex-direction: column; height: 100vh; }
    header { background: #1a2b4a; color: white; padding: 16px 24px; font-size: 18px; font-weight: 600; }
    #chat-window { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .message { max-width: 70%; padding: 12px 16px; border-radius: 8px; line-height: 1.5; }
    .user { background: #1a2b4a; color: white; align-self: flex-end; }
    .bot { background: white; color: #1a2b4a; align-self: flex-start; border: 1px solid #dce3ed; }
    #input-area { display: flex; padding: 16px; background: white; border-top: 1px solid #dce3ed; gap: 12px; }
    #question { flex: 1; padding: 10px 14px; border: 1px solid #dce3ed; border-radius: 6px; font-size: 15px; }
    #send-btn { background: #1a2b4a; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 15px; }
    #send-btn:hover { background: #26407a; }
  </style>
</head>
<body>
  <header>Wiki Chatbot</header>
  <div id="chat-window"></div>
  <div id="input-area">
    <input id="question" type="text" placeholder="Ask a question about the wiki..." />
    <button id="send-btn">Send</button>
  </div>

  <script>
    const chatWindow = document.getElementById('chat-window');
    const input = document.getElementById('question');
    const btn = document.getElementById('send-btn');

    function addMessage(text, sender) {
      const msg = document.createElement('div');
      msg.className = `message ${sender}`;
      msg.textContent = text;
      chatWindow.appendChild(msg);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    async function sendMessage() {
      const question = input.value.trim();
      if (!question) return;
      addMessage(question, 'user');
      input.value = '';
      addMessage('Thinking...', 'bot');

      const response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question })
      });

      const data = await response.json();
      chatWindow.removeChild(chatWindow.lastChild);
      addMessage(data.answer, 'bot');
    }

    btn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
  </script>
</body>
</html>
